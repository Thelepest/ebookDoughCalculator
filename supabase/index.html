<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #eef6ff;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #5b6b7a;
        --accent: #2b7de9;
        --accent-dark: #1f5fbf;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 60%), var(--bg);
        color: var(--text);
      }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
      label { display: block; font-size: 14px; margin: 12px 0 6px; }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status { margin-top: 12px; font-size: 14px; }
      .error { color: #b91c1c; }
      .ok { color: #166534; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Imposta una nuova password</h1>
        <p>Inserisci la nuova password per il tuo account.</p>

        <div id="status" class="status"></div>

        <form id="reset-form">
          <label for="password">Nuova password</label>
          <input id="password" type="password" minlength="6" required />

          <label for="confirm">Conferma password</label>
          <input id="confirm" type="password" minlength="6" required />

          <button type="submit">Aggiorna password</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const SUPABASE_URL = 'https://itkferexvvbkngorresw.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_UzAYwFfIVHhi_xLl6MI5-g_2RypS47G';
      const LOGIN_REDIRECT_URL = 'http://localhost:3000/login';

      const statusEl = document.getElementById('status');
      const form = document.getElementById('reset-form');
      const submitButton = form.querySelector('button');
      submitButton.disabled = true;

      const setStatus = (text, type) => {
        statusEl.textContent = text || '';
        statusEl.className = 'status ' + (type || '');
      };

      if (!SUPABASE_URL || !SUPABASE_URL.startsWith('http')) {
        setStatus('Configurazione non valida: SUPABASE_URL mancante o errata.', 'error');
        form.style.display = 'none';
        throw new Error('Invalid Supabase URL');
      }
      if (!SUPABASE_ANON_KEY) {
        setStatus('Configurazione non valida: SUPABASE_ANON_KEY mancante.', 'error');
        form.style.display = 'none';
        throw new Error('Missing Supabase anon key');
      }

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let sessionReady = false;

      const parseParams = () => {
        const hash = window.location.hash.replace(/^#/, '');
        const hashParams = new URLSearchParams(hash);
        const queryParams = new URLSearchParams(window.location.search);
        return { hashParams, queryParams };
      };

      const initSession = async () => {
        const { hashParams, queryParams } = parseParams();

        const error = hashParams.get('error') || queryParams.get('error');
        const errorCode = hashParams.get('error_code') || queryParams.get('error_code');
        if (error || errorCode) {
          setStatus('Link non valido o scaduto. Richiedi una nuova email.', 'error');
          return false;
        }

        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const code = queryParams.get('code');
        const tokenHash = queryParams.get('token_hash') || hashParams.get('token_hash');

        if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          });
          if (error) {
            setStatus('Link non valido o scaduto. Richiedi una nuova email.', 'error');
            return false;
          }
          return true;
        }

        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) {
            setStatus('Link non valido o scaduto. Richiedi una nuova email.', 'error');
            return false;
          }
          return true;
        }

        if (tokenHash) {
          const { error } = await supabase.auth.verifyOtp({
            type: 'recovery',
            token_hash: tokenHash,
          });
          if (error) {
            setStatus('Link non valido o scaduto. Richiedi una nuova email.', 'error');
            return false;
          }
          return true;
        }

        setStatus('Sessione di reset non valida. Richiedi una nuova email.', 'error');
        return false;
      };

      const updateButtonState = () => {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        const mismatch = password && confirm && password !== confirm;
        const tooShort = password && password.length < 6;
        submitButton.disabled = !sessionReady || !password || !confirm || mismatch || tooShort;
      };

      (async () => {
        setStatus('Verifica link in corso...');
        const ok = await initSession();
        if (!ok) {
          form.style.display = 'none';
          submitButton.disabled = true;
          return;
        }
        sessionReady = true;
        setStatus('');
        updateButtonState();
      })();

      document.getElementById('password').addEventListener('input', () => {
        const password = document.getElementById('password').value;
        if (password && password.length < 6) {
          setStatus('La password deve avere almeno 6 caratteri.', 'error');
        } else {
          setStatus('');
        }
        updateButtonState();
      });

      document.getElementById('confirm').addEventListener('input', () => {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password && confirm && password !== confirm) {
          setStatus('Le password non corrispondono.', 'error');
        } else {
          setStatus('');
        }
        updateButtonState();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (password !== confirm) {
          setStatus('Le password non corrispondono.', 'error');
          return;
        }
        if (password.length < 6) {
          setStatus('La password deve avere almeno 6 caratteri.', 'error');
          return;
        }

        setStatus('Aggiornamento in corso...');
        const { error } = await supabase.auth.updateUser({ password });
        if (error) {
          setStatus('Errore durante l\'aggiornamento. Riprova.', 'error');
          return;
        }
        setStatus('Password aggiornata. Ora puoi accedere.', 'ok');
        if (LOGIN_REDIRECT_URL) {
          setTimeout(() => {
            window.location.href = LOGIN_REDIRECT_URL;
          }, 1200);
        }
      });
    </script>
  </body>
</html>
